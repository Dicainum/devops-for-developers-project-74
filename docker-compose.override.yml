services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # environment:
    #   - NODE_ENV=development
    volumes:
      - ./app:/app
    env_file:
      - .env
    command: make dev
    # ports:
    #   - "8080:8080"

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - app